// Compatibility app: bundled Apple protocol code plus native clipboard/TCP access.
plugins { id 'com.android.application' }
android {
    namespace 'dev.applescreen.prototype'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.applescreen.prototype'
        minSdk 31
        targetSdk 35
        ndk { abiFilters 'arm64-v8a' }
        versionCode 4
        versionName '0.4-ivnc'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        debug {
            storeFile rootProject.file('../.dev/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    sourceSets.main.jniLibs.srcDirs = [layout.buildDirectory.dir('native-libs')]
    sourceSets.main.assets.srcDirs = ['src/main/assets', layout.buildDirectory.dir('protocol-assets')]
}
tasks.register('bundleProtocol', Copy) {
    from('../..') { include 'ard/**', 'noVNC/core/**', 'noVNC/vendor/**', 'noVNC/LICENSE.txt', 'LICENSE'
        exclude 'ard/tests/**', 'ard/hp/vendor/libav/sources/**' }
    into layout.buildDirectory.dir('protocol-assets')
}
tasks.named('preBuild').configure { dependsOn 'bundleProtocol' }

// Corresponding FFmpeg source and license accompany the replaceable LGPL libraries.
tasks.register('bundleNativeLicenses', Copy) {
    from('../../ard/hp/vendor/libav/sources') { include 'ffmpeg-9.0.tar.xz' }
    from('../../.dev/native-hevc/ffmpeg-9.0') { include 'COPYING.LGPLv2.1', 'LICENSE.md' }
    from('../../scripts') { include 'build-video.sh', 'env.sh', 'toolchain-lock.json' }
    into layout.buildDirectory.dir('protocol-assets/licenses/ffmpeg')
}
tasks.named('preBuild').configure { dependsOn 'bundleNativeLicenses' }
