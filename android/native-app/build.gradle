// Native application with LibVNCClient and an original Android UI.
plugins { id 'com.android.application' }
android {
    namespace 'dev.ivnc.nativeclient'
    compileSdk 35
    ndkVersion '28.2.13676358'
    defaultConfig {
        applicationId 'dev.ivnc.nativeclient'
        minSdk 31
        targetSdk 35
        versionCode 17
        versionName '0.17-native-touch'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { targets 'ivncrfb'; cppFlags '-std=c++17 -O3' } }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    signingConfigs { debug { storeFile rootProject.file('../.dev/debug.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
}
